name: Build Tafseer APK

on:
  push:
    branches:
      - claude/tafseer-ibn-kaseer-app-jn5fgn
    paths:
      - 'tafseer/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: tafseer
        run: flutter pub get

      - name: Build release APK
        working-directory: tafseer
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-ibn-kaseer-apk
          path: tafseer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          APK=tafseer/build/app/outputs/flutter-apk/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "✅ APK তৈরি সফল হয়েছে"
            echo "📦 ফাইলের সাইজ: $SIZE"
          fi
