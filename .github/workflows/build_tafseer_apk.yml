name: Build Tafseer APK

on:
  push:
    branches:
      - claude/tafseer-ibn-kaseer-app-jn5fgn
    paths:
      - 'tafseer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: tafseer
        run: flutter pub get

      - name: Build release APK
        working-directory: tafseer
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafseer-ibn-kaseer-apk
          path: tafseer/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tafseer-latest
          name: তাফসীর ইবনে কাসীর - সর্বশেষ বিল্ড
          body: |
            ## তাফসীর ইবনে কাসীর APK

            নিচের লিংক থেকে APK ডাউনলোড করুন এবং Android ফোনে ইনস্টল করুন।

            **ফিচার:**
            - ১১৪টি সূরা তালিকা
            - PDF রিডার (নিজের PDF লিংক দিয়ে পড়া যাবে)
            - বুকমার্ক সিস্টেম
            - সর্বশেষ পঠিত মনে রাখে
            - পৃষ্ঠায় যাওয়ার অপশন
            - ডার্ক ও লাইট মোড
          files: tafseer/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          prerelease: false
